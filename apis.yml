aid: beside
name: Beside
description: 'Beside (operated by Interface, Inc. / Heart Hands, Inc.) is an AI-powered
  business phone system built for contractors, field teams, and small-to-medium businesses.
  Its AI receptionist answers inbound calls 24/7, captures caller details, qualifies
  and routes leads, books appointments, and produces automatic call summaries and
  searchable transcripts, alongside team phone management, shared inboxes, roles and
  permissions, unlimited US/Canada calls and texts, spam blocking, and integrations
  with CRMs such as HubSpot, Attio, and Follow Up Boss (plus 7,000+ apps via Zapier).
  Beside advertises forthcoming compatibility with MCP clients such as Claude and ChatGPT,
  but publishes no public API today. Surfaced as a portfolio company of eqt-ventures.'
